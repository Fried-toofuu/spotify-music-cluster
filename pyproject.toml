[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-music-clustering-web"
version = "0.1.0"
description = "Notebook-derived acoustic clustering with a local REST API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "joblib==1.5.1",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]
web = ["gradio>=6.31,<7", "httpx>=0.28,<1", "plotly>=6.9,<7"]
dev = ["pytest==9.0.3", "ruff==0.14.4", "build==1.3.0", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spotify_cluster.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
