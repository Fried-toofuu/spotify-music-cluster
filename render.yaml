services:
  - type: web
    name: acoustic-observatory
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: ARTIFACT_DATASET
        value: Khahn-nh/acoustic-observatory-artifacts
      - key: PUBLIC_MODE
        value: "1"
